<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Presence Organizer Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="config.js"></script>
<style>
  body{background:#0b0d12;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:20px;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:1.4rem;}
  .card{background:#161920;border-radius:12px;padding:16px;margin-bottom:16px;}
  input{padding:8px;border-radius:6px;border:1px solid #444;background:#1a1d24;color:#eee;margin-right:8px;}
  button{padding:8px 14px;border-radius:8px;border:0;background:#3b82f6;color:#fff;cursor:pointer;font-weight:600;}
  button.secondary{background:#374151;}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #2a2e37;}
  .muted{opacity:.6;font-size:.85rem;}
  .pill{padding:2px 8px;border-radius:999px;font-size:.75rem;}
  .pill.ok{background:#123322;color:#7fffa1;}
  .pill.fail{background:#3a1414;color:#ff8080;}
  .key{font-family:monospace;background:#1a1d24;padding:8px;border-radius:8px;word-break:break-all;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Organizer Dashboard</h1>

  <div class="card">
    <label>Admin API Key</label><br/>
    <input id="adminKey" placeholder="x-admin-key" style="width:300px" />
    <div class="muted">Stored only in this browser tab's memory / localStorage.</div>
  </div>

  <div class="card">
    <h3>Create Event</h3>
    <input id="eventName" placeholder="Event name, e.g. NGO Cleaning Drive" style="width:300px" /><br/>
    <input id="eventId" placeholder="Event ID (optional — auto-generated if blank, e.g. NGO_CLEANING_001)" style="width:300px;margin-top:6px" />
    <button onclick="createEvent()">Create Event</button>
    <div id="createEventErr" class="muted"></div>
    <div id="createEventOk" class="muted" style="color:#7fffa1"></div>
  </div>

  <div class="card">
    <h3>Load Event</h3>
    <input id="loadEventId" placeholder="Event ID" style="width:300px" />
    <button onclick="loadEvent()">Load</button>
    <div id="eventDetails"></div>
  </div>

  <div class="card hidden" id="screensCard" style="display:none">
    <h3>Screens</h3>
    <input id="screenName" placeholder="Screen name, e.g. Front Desk" style="width:220px" />
    <button onclick="createScreen()">Add Screen</button>
    <table id="screensTable"><thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Last Seen</th><th></th></tr></thead><tbody></tbody></table>
    <div id="newScreenKey"></div>
  </div>

  <div class="card hidden" id="attendanceCard" style="display:none">
    <h3>Attendance</h3>
    <div id="attendanceSummary" class="muted"></div>
    <button class="secondary" onclick="loadAttendance()">Refresh</button>
    <table id="attendanceTable"><thead><tr><th>Status</th><th>Reason</th><th>Screen</th><th>Time</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
const API = window.PRESENCE_CONFIG.API_BASE_URL;
let currentEventId = null;

const savedKey = localStorage.getItem('presence_admin_key');
if (savedKey) document.getElementById('adminKey').value = savedKey;

function adminKey() {
  const k = document.getElementById('adminKey').value.trim();
  localStorage.setItem('presence_admin_key', k);
  return k;
}

async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey(), ...(opts.headers || {}) },
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

async function createEvent() {
  const name = document.getElementById('eventName').value.trim();
  const customId = document.getElementById('eventId').value.trim();
  const errEl = document.getElementById('createEventErr');
  const okEl = document.getElementById('createEventOk');
  errEl.textContent = '';
  okEl.textContent = '';
  if (!name) { errEl.textContent = 'Name required'; return; }
  try {
    const event = await api('/api/v1/events', {
      method: 'POST',
      body: JSON.stringify({ name, id: customId || undefined }),
    });
    okEl.textContent = `Event created — ID: ${event.id}`;
    document.getElementById('loadEventId').value = event.id;
    await loadEvent();
  } catch (err) {
    errEl.textContent = err.message;
  }
}

async function loadEvent() {
  const id = document.getElementById('loadEventId').value.trim();
  if (!id) return;
  try {
    const event = await api(`/api/v1/events/${id}`, { method: 'GET' });
    currentEventId = event.id;
    document.getElementById('eventDetails').innerHTML = `
      <p><b>${event.name}</b> — <span class="muted">${event.id}</span></p>
      <p class="muted">Token validity: ${event.token_validity}s • Active: ${event.active}</p>
    `;
    document.getElementById('screensCard').style.display = 'block';
    document.getElementById('attendanceCard').style.display = 'block';
    await loadScreens();
    await loadAttendance();
  } catch (err) {
    document.getElementById('eventDetails').innerHTML = `<p class="muted">${err.message}</p>`;
  }
}

async function createScreen() {
  const name = document.getElementById('screenName').value.trim();
  try {
    const screen = await api(`/api/v1/events/${currentEventId}/screens`, {
      method: 'POST', body: JSON.stringify({ name }),
    });
    document.getElementById('newScreenKey').innerHTML = `
      <p class="muted">Screen created. Copy this key into the Display page now — it will not be shown again:</p>
      <div class="key">screen_id: ${screen.id}<br/>screen_key: ${screen.screen_key}</div>
    `;
    await loadScreens();
  } catch (err) {
    document.getElementById('newScreenKey').innerHTML = `<p class="muted">${err.message}</p>`;
  }
}

async function loadScreens() {
  const screens = await api(`/api/v1/events/${currentEventId}/screens`, { method: 'GET' });
  const tbody = document.querySelector('#screensTable tbody');
  tbody.innerHTML = screens.map((s) => `
    <tr>
      <td>${s.id}</td>
      <td>${s.name}</td>
      <td><span class="pill ${s.status === 'active' ? 'ok' : 'fail'}">${s.status}</span></td>
      <td class="muted">${s.last_seen || 'never'}</td>
      <td>${s.status === 'active' ? `<button class="secondary" onclick="revokeScreen('${s.id}')">Revoke</button>` : ''}</td>
    </tr>
  `).join('');
}

async function revokeScreen(screenId) {
  await api(`/api/v1/events/${currentEventId}/screens/${screenId}/revoke`, { method: 'POST', body: '{}' });
  await loadScreens();
}

async function loadAttendance() {
  const data = await api(`/api/v1/events/${currentEventId}/attendance`, { method: 'GET' });
  document.getElementById('attendanceSummary').textContent = `${data.verified} verified • ${data.failed} failed`;
  const tbody = document.querySelector('#attendanceTable tbody');
  tbody.innerHTML = data.attempts.map((a) => `
    <tr>
      <td><span class="pill ${a.status === 'VERIFIED' ? 'ok' : 'fail'}">${a.status}</span></td>
      <td class="muted">${a.failure_reason || ''}</td>
      <td class="muted">${a.screen_id || ''}</td>
      <td class="muted">${new Date(a.verified_at).toLocaleString()}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
