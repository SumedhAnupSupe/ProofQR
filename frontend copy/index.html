<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Presence Platform</title>
<style>
  html,body{height:100%;margin:0;background:#0b0d12;color:#eee;font-family:system-ui,sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;box-sizing:border-box;}
  h1{letter-spacing:.06em;text-transform:uppercase;}
  .tag{opacity:.6;margin-bottom:24px;}
  a.link{display:block;width:260px;padding:14px 20px;margin:8px 0;border-radius:10px;background:#161920;color:#eee;text-decoration:none;font-weight:600;border:1px solid #2a2e37;}
  a.link:hover{background:#1f2430;border-color:#3b82f6;}
  .muted{opacity:.5;font-size:.85rem;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Presence Platform</h1>
  <div class="tag">Dynamic QR proof-of-presence verification</div>
  <a class="link" href="/organizer">Organizer Dashboard</a>
  <a class="link" href="/display">Display (screen / TV)</a>
  <a class="link" href="/scanner">Scanner (mobile)</a>
  <div class="muted">Camera access requires HTTPS (or localhost).</div>
</div>
</body>
</html>
